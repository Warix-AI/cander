<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cander</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #fafafa;
        color: #111;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 0.75rem;
        opacity: 0.7;
        font-size: 14px;
        line-height: 1.45;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.15rem;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      code {
        font-size: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <!-- Fallback when Capacitor cannot reach server.url -->
    <main>
      <h1 id="title">Opening Cander…</h1>
      <p id="detail">Connecting to the hosted app.</p>
      <p><code id="url"></code></p>
      <p style="margin-top: 1rem">
        <button type="button" id="retry" hidden>Try again</button>
      </p>
    </main>
    <script>
      (function () {
        var PRIMARY = "https://cander.app";
        var FALLBACK = "https://cander.vercel.app";
        var params = new URLSearchParams(location.search);
        var target = params.get("url") || PRIMARY;
        var title = document.getElementById("title");
        var detail = document.getElementById("detail");
        var urlEl = document.getElementById("url");
        var retry = document.getElementById("retry");
        urlEl.textContent = target;

        function go(url) {
          target = url;
          urlEl.textContent = url;
          title.textContent = "Opening Cander…";
          detail.textContent = "Connecting to the hosted app.";
          retry.hidden = true;
          location.replace(url);
        }

        retry.onclick = function () {
          go(target === PRIMARY ? FALLBACK : PRIMARY);
        };

        // If this local page is showing, remote load already failed — offer retry.
        setTimeout(function () {
          title.textContent = "Cander can’t load right now";
          detail.textContent =
            "Check your network, then try again. Dev builds need the local Next server running.";
          retry.hidden = false;
        }, 1200);

        // Attempt an immediate hop to production when opened as the standalone fallback.
        if (!params.get("stay")) {
          setTimeout(function () {
            go(PRIMARY);
          }, 100);
        }
      })();
    </script>
  </body>
</html>
