<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cander</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #fafafa;
        color: #111;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 0.75rem;
        opacity: 0.7;
        font-size: 14px;
        line-height: 1.45;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.15rem;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      code {
        font-size: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <!-- Local fallback only — Capacitor normally loads server.url directly. -->
    <main>
      <h1>Cander</h1>
      <p>Couldn’t reach the hosted app. Check your network, then try again.</p>
      <p><code id="url">https://cander.app</code></p>
      <p style="margin-top: 1rem">
        <button type="button" id="retry">Open Cander</button>
      </p>
    </main>
    <script>
      (function () {
        var PRIMARY = "https://cander.app";
        var FALLBACK = "https://cander.vercel.app";
        var next = PRIMARY;
        document.getElementById("retry").onclick = function () {
          var url = next;
          next = url === PRIMARY ? FALLBACK : PRIMARY;
          document.getElementById("url").textContent = url;
          location.href = url;
        };
      })();
    </script>
  </body>
</html>
