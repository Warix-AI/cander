<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cander</title>
    <script>
      (function () {
        try {
          var theme = null;
          var a = localStorage.getItem("courier-appearance-v2");
          if (a) {
            try {
              var j = JSON.parse(a);
              if (
                j.colorMode === "dark" ||
                j.colorMode === "dark-charcoal" ||
                j.colorMode === "dark-blue"
              ) {
                theme = "dark";
              } else if (
                j.colorMode === "light" ||
                j.colorMode === "light-blue"
              ) {
                theme = "light";
              } else if (typeof j.color === "number") {
                theme = j.color < 45 ? "light" : "dark";
              }
            } catch (e) {}
          }
          if (!theme) {
            var t = localStorage.getItem("theme");
            theme =
              t === "dark" ? "dark" : t === "light" ? "light" : null;
          }
          if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.backgroundColor =
            theme === "dark" ? "#000000" : "#ffffff";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.backgroundColor = "#ffffff";
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
        background: #ffffff;
        color: #111;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #000000;
        color: #f5f5f5;
      }
      .splash {
        min-height: 100%;
        display: grid;
        place-items: center;
      }
      .mark {
        width: 42px;
        height: 40px;
        border-radius: 10px;
        background: #111;
        opacity: 0.92;
      }
      html[data-theme="dark"] .mark {
        background: #fff;
      }
      main {
        display: none;
        max-width: 22rem;
        padding: 1.5rem;
        text-align: center;
        margin: 0 auto;
      }
      body.offline main {
        display: block;
      }
      body.offline .splash {
        display: none;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 0.75rem;
        opacity: 0.7;
        font-size: 14px;
        line-height: 1.45;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.15rem;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      html[data-theme="dark"] button {
        background: #fff;
        color: #111;
      }
      code {
        font-size: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <!-- Shown briefly if Capacitor falls back to local www before remote loads. -->
    <div class="splash" aria-hidden="true">
      <div class="mark"></div>
    </div>
    <main>
      <h1>Cander</h1>
      <p>Couldn’t reach the hosted app. Check your network, then try again.</p>
      <p><code id="url">https://cander.app</code></p>
      <p style="margin-top: 1rem">
        <button type="button" id="retry">Open Cander</button>
      </p>
    </main>
    <script>
      (function () {
        var PRIMARY = "https://cander.app";
        var FALLBACK = "https://cander.vercel.app";
        var next = PRIMARY;
        var retry = document.getElementById("retry");
        if (retry) {
          retry.onclick = function () {
            var url = next;
            next = url === PRIMARY ? FALLBACK : PRIMARY;
            document.getElementById("url").textContent = url;
            location.href = url;
          };
        }
        // If we're still on local www after a few seconds, show offline UI.
        setTimeout(function () {
          if (!navigator.onLine) document.body.classList.add("offline");
        }, 2500);
      })();
    </script>
  </body>
</html>
