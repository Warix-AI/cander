# Minimal Supabase CLI config for local development.
# See: https://supabase.com/docs/guides/cli

project_id = "cander"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

# Hosted projects: set Confirm signup template in the dashboard to include
# {{ .Token }} (6-digit OTP). See docs/runbook/supabase.md.
[auth.email]
enable_signup = true
enable_confirmations = true
# Number of characters used in the email OTP (hosted dashboard may differ).
otp_length = 8
